<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kundenportal Clean Service</title>
<style>
  :root{
    --navy:#0b2740; --teal:#2bb6b7; --teal-pale:#bee2e9;
    --paper:#f4f6f8; --panel:#ffffff; --line:#e2e6ea;
    --ink:#1b2a35; --grey:#5b6b76;
    --amber:#b3541e; --amber-soft:#fbeee4;
    --ok:#1c7a5e; --ok-soft:#e6f4ef;
    --font: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); line-height:1.5;}

  #login-screen{max-width:340px; margin:100px auto; padding:32px; background:var(--panel); border:1px solid var(--line); border-radius:14px;}
  #login-screen h1{font-size:18px; margin:0 0 18px; color:var(--navy);}
  #login-screen input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:12px;}
  #login-screen button{width:100%; padding:12px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-size:14px; font-weight:600; cursor:pointer;}
  #login-error{color:var(--amber); font-size:13px; margin-bottom:10px; display:none;}

  #dashboard{display:none; max-width:1100px; margin:0 auto; padding:32px 24px 80px;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  header h1{font-size:20px; color:var(--navy); margin:0;}

  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .stat .num{font-size:22px; font-weight:700; color:var(--teal);}
  .stat .label{font-size:11px; color:var(--grey); margin-top:2px;}

  .filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters button{padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer;}
  .filters button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  th, td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top;}
  th{font-size:11px; text-transform:uppercase; color:var(--grey); background:#f9fafb;}
  .badge{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600;}
  .badge.neu{background:var(--amber-soft); color:var(--amber);}
  .badge.erledigt, .badge.akzeptieren{background:var(--ok-soft); color:var(--ok);}
  .badge.ablehnen{background:#fbeaea; color:#a33;}
  .details-cell{max-width:220px; white-space:pre-wrap; font-size:12px; color:var(--grey);}
  .actions{display:flex; gap:6px; flex-wrap:wrap; min-width:220px;}
  .actions button{font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer;}
  .actions button.accept{border-color:var(--ok); color:var(--ok);}
  .actions button.reject{border-color:#a33; color:#a33;}
  .actions textarea{width:100%; font-size:12px; padding:6px; border:1px solid var(--line); border-radius:6px; min-height:44px; margin-top:6px;}
  .row-msg{font-size:11px; color:var(--grey); margin-top:4px;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Admin-Bereich — Kundenportal</h1>
  <div id="login-error" role="alert"></div>
  <label for="login-password" style="font-size:13px; display:block; margin-bottom:6px;">Passwort</label>
  <input type="password" id="login-password" placeholder="Passwort" onkeydown="if(event.key==='Enter') login()">
  <button onclick="login()">Anmelden</button>
</div>

<div id="dashboard">
  <header>
    <h1>Meldungen aus dem Kundenportal</h1>
    <button onclick="loadAll()" style="border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:12.5px;">↻ Aktualisieren</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button data-f="" class="active" onclick="setFilter('')">Alle</button>
    <button data-f="neu" onclick="setFilter('', 'neu')">Nur offen</button>
    <button data-f="verschiebung" onclick="setFilter('verschiebung')">Terminverschiebung</button>
    <button data-f="absage" onclick="setFilter('absage')">Absage</button>
    <button data-f="reklamation" onclick="setFilter('reklamation')">Reklamation</button>
    <button data-f="schaden" onclick="setFilter('schaden')">Schadenmeldung</button>
    <button data-f="zusatz" onclick="setFilter('zusatz')">Zusatzauftrag</button>
  </div>

  <table>
    <thead>
      <tr><th>Datum</th><th>Kategorie</th><th>Kunde</th><th>Objekt</th><th>Details</th><th>Status</th><th>Aktion</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const KAT_LABEL = {verschiebung:'Terminverschiebung', absage:'Absage', reklamation:'Reklamation', schaden:'Schadenmeldung', zusatz:'Zusatzauftrag'};
let currentKategorie = '';
let currentStatus = '';

async function login(){
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  try{
    const resp = await fetch('/api/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password})});
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Anmeldung fehlgeschlagen.');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
  } catch(err){
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
}

function setFilter(kategorie, status){
  currentKategorie = kategorie || '';
  currentStatus = status || '';
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadList();
}

async function loadAll(){
  await Promise.all([loadStats(), loadList()]);
}

async function loadStats(){
  const resp = await fetch('/api/admin/stats');
  if(!resp.ok) return;
  const s = await resp.json();
  const box = document.getElementById('stats');
  box.innerHTML = `
    <div class="stat"><div class="num">${s.total}</div><div class="label">Meldungen (30 Tage)</div></div>
    <div class="stat"><div class="num">${s.offen}</div><div class="label">Noch offen</div></div>
    <div class="stat"><div class="num">${s.pro_kategorie.absage || 0}</div><div class="label">Absagen</div></div>
    <div class="stat"><div class="num">${s.pro_kategorie.verschiebung || 0}</div><div class="label">Verschiebungen</div></div>
    <div class="stat"><div class="num">${s.fehlgeschlagene_versuche}</div><div class="label">Fehlgeschlagene Versuche</div></div>
  `;
}

async function loadList(){
  const params = new URLSearchParams();
  if(currentKategorie) params.set('kategorie', currentKategorie);
  if(currentStatus) params.set('status', currentStatus);
  const resp = await fetch('/api/admin/list?' + params.toString());
  if(!resp.ok) return;
  const { meldungen } = await resp.json();

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = meldungen.map(m => renderRow(m)).join('');
}

function renderRow(m){
  const datum = new Date(m.created_at).toLocaleString('de-CH', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
  const statusBadge = `<span class="badge ${m.status}">${m.status}</span>`;

  let actions = '';
  if(m.kategorie === 'verschiebung'){
    actions = `
      <div class="actions" id="actions-${m.id}">
        <button class="accept" onclick="reply(${m.id}, 'akzeptieren')">Akzeptieren</button>
        <button class="reject" onclick="reply(${m.id}, 'ablehnen')">Ablehnen</button>
      </div>`;
  } else {
    actions = `
      <div class="actions" id="actions-${m.id}">
        <textarea id="msg-${m.id}" placeholder="Kurze Rückmeldung an den Kunden …"></textarea>
        <button onclick="reply(${m.id}, 'nachricht')">Antwort senden</button>
        <button onclick="reply(${m.id}, 'erledigt')">Als erledigt markieren</button>
      </div>`;
  }

  return `<tr id="row-${m.id}">
    <td>${datum}</td>
    <td>${KAT_LABEL[m.kategorie] || m.kategorie}</td>
    <td>${m.name}<br><span style="color:var(--grey); font-size:11.5px;">${m.email || ''}</span></td>
    <td>${m.objekt_id}</td>
    <td class="details-cell">${(m.details || '').slice(0, 200)}</td>
    <td>${statusBadge}</td>
    <td>${actions}</td>
  </tr>`;
}

async function reply(id, action){
  const msgField = document.getElementById(`msg-${id}`);
  const nachricht = msgField ? msgField.value.trim() : '';
  try{
    const resp = await fetch('/api/admin/reply', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id, action, nachricht })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Fehlgeschlagen');

    const box = document.getElementById(`actions-${id}`);
    const status = action === 'nachricht' ? (data.mail === 'sent' ? 'Nachricht gesendet' : 'Gespeichert, Mail fehlgeschlagen') : 'Erledigt';
    box.insertAdjacentHTML('beforeend', `<div class="row-msg">✓ ${status}</div>`);
    loadStats();
  } catch(err){
    alert('Fehler: ' + err.message);
  }
}
</script>

</body>
</html>
